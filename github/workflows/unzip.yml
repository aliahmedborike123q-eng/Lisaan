name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o *.zip -d .
          rm *.zip
      - run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "unzip project"
          git push
